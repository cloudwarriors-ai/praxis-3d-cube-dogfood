name: "Autopilot: Intake"

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to process'
        required: true
        type: number

concurrency:
  group: autopilot-intake-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.issue_number || github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read
  issues: write
  actions: read

jobs:
  intake:
    if: |
      (github.event_name == 'issues' &&
       github.event.action == 'labeled' &&
       github.event.label.name == 'AUTOFIX: Ready') ||
      (github.event_name == 'issue_comment' &&
       !github.event.issue.pull_request &&
       contains(github.event.comment.body, '/autofix')) ||
      github.event_name == 'workflow_dispatch'
    name: Autopilot Intake
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      ISSUE_NUMBER: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.issue_number || github.event.issue.number }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # --- Shadow guard ---
      # When SHADOW_ENABLED=true (repo variable), block execution on the source
      # repo and route all autofix work through scopely-shadow instead.
      # Toggle: Settings → Secrets and variables → Actions → Variables → SHADOW_ENABLED
      - name: Check shadow guard
        id: shadow_guard
        uses: actions/github-script@v7
        env:
          SHADOW_ENABLED_VAR: ${{ vars.SHADOW_ENABLED }}
        with:
          script: |
            const shadowEnabled = process.env.SHADOW_ENABLED_VAR === 'true';
            core.setOutput('blocked', shadowEnabled ? 'true' : 'false');

      - name: Exit if shadow-enabled
        if: steps.shadow_guard.outputs.blocked == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- AUTOPILOT_SHADOW_GUARD -->';
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 20,
            });
            if (!comments.data.some(c => c.body.includes(marker))) {
              const shadowRepoName = `${context.repo.repo}-shadow`;
              const shadowIssuesUrl = `https://github.com/${context.repo.owner}/${shadowRepoName}/issues`;
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: [
                  marker,
                  '**Autopilot skipped on source repo:** this repo uses shadow-first execution.',
                  '',
                  `The fix will run in the [shadow repo](${shadowIssuesUrl}). The next hourly sync will stamp \`AUTOFIX: Ready\` on the corresponding shadow issue (if \`AUTOQUEUE_ENABLED=true\` on the shadow repo). Once the shadow run starts, this issue will receive live updates with the shadow issue and workflow run links.`,
                ].join('\n'),
              });
            }
            core.setFailed('Shadow-enabled — execution blocked at source, runs in shadow repo');

      # --- Kill switch ---
      - name: Check kill switch
        id: killswitch
        if: steps.shadow_guard.outputs.blocked != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = Number(process.env.ISSUE_NUMBER);

            // Global kill switch
            try {
              const issues = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: 'AUTOPILOT: Disabled',
                state: 'open',
                per_page: 5,
              });
              if (issues.data.length > 0) {
                core.setOutput('disabled', 'true');
                core.setOutput('reason', `Global kill switch active on issue #${issues.data[0].number}`);
                return;
              }
            } catch (err) {
              core.warning(`Kill switch check failed: ${err.message}`);
            }

            // Per-issue skip
            try {
              const issue = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
              });
              const labels = issue.data.labels.map(l => typeof l === 'string' ? l : l.name);
              if (labels.includes('AUTOPILOT: Skip')) {
                core.setOutput('disabled', 'true');
                core.setOutput('reason', `Issue #${issueNumber} has AUTOPILOT: Skip label`);
                return;
              }
            } catch (err) {
              core.warning(`Issue label check failed: ${err.message}`);
            }

            // Rate limit: max 5 concurrent autopilot runs
            try {
              const runs = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                status: 'in_progress',
                per_page: 100,
              });
              const autopilotRuns = runs.data.workflow_runs.filter(r =>
                r.name && r.name.toLowerCase().includes('autopilot')
              );
              if (autopilotRuns.length >= 5) {
                core.setOutput('disabled', 'true');
                core.setOutput('reason', `Rate limit: ${autopilotRuns.length} concurrent runs (max 5)`);
                return;
              }
            } catch (err) {
              core.warning(`Rate limit check failed: ${err.message}`);
            }

            core.setOutput('disabled', 'false');

      - name: Exit if disabled
        if: steps.shadow_guard.outputs.blocked != 'true' && steps.killswitch.outputs.disabled == 'true'
        uses: actions/github-script@v7
        env:
          KILLSWITCH_REASON: ${{ steps.killswitch.outputs.reason }}
        with:
          script: |
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const reason = process.env.KILLSWITCH_REASON || 'Unknown reason';
            const marker = '<!-- AUTOPILOT_DISABLED -->';

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 20,
            });

            if (!comments.data.some(c => c.body.includes(marker))) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: `${marker}\n**Autopilot skipped:** ${reason}\n\nRemove the blocking label and re-apply \`AUTOFIX: Ready\` to retry.`,
              });
            }
            core.setFailed(`Autopilot disabled: ${reason}`);

      # --- Resolve issue context ---
      - name: Resolve issue context
        if: steps.shadow_guard.outputs.blocked != 'true' && steps.killswitch.outputs.disabled != 'true'
        id: context
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = Number(process.env.ISSUE_NUMBER);

            const issue = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });

            if (issue.data.state !== 'open') {
              core.setFailed(`Issue #${issueNumber} is ${issue.data.state}, not open`);
              return;
            }

            const labels = issue.data.labels.map(l => typeof l === 'string' ? l : l.name);
            const title = issue.data.title || '';

            // --- Resolve track ---
            let track = null;
            if (labels.includes('TRACK: Bug')) track = 'bugs';
            else if (labels.includes('TRACK: Feature')) track = 'features';
            else {
              const lower = title.toLowerCase();
              if (lower.startsWith('bug:') || lower.startsWith('[bug]')) track = 'bugs';
              else if (lower.startsWith('feature:') || lower.startsWith('feat:') || lower.startsWith('[feature]')) track = 'features';
            }

            if (!track) {
              const marker = '<!-- AUTOPILOT_TRACK_ERROR -->';
              const body = [
                marker,
                '**Autopilot cannot determine the issue track.**',
                '',
                'Please add one of these labels:',
                '- `TRACK: Bug` — for bug fixes',
                '- `TRACK: Feature` — for new features',
                '',
                'Or prefix the title with `Bug:` or `Feature:`.',
                '',
                'Then re-apply the `AUTOFIX: Ready` label to retry.',
              ].join('\n');
              const existingComments = await github.rest.issues.listComments({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issueNumber, per_page: 50,
              });
              const existingTrackError = existingComments.data.find(c => c.body && c.body.includes(marker));
              if (existingTrackError) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  comment_id: existingTrackError.id, body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: issueNumber, body,
                });
              }
              core.setFailed('Track unresolvable');
              return;
            }

            // --- Resolve base branch ---
            // Scopely uses `dev` as the integration branch.
            let base = 'dev';
            if (labels.includes('ENV: Prod')) base = 'main';
            else if (labels.includes('ENV: Dev')) base = 'dev';

            const head = `autofix/issue-${issueNumber}`;

            core.setOutput('title', title);
            core.setOutput('track', track);
            core.setOutput('base', base);
            core.setOutput('head', head);
            core.setOutput('labels', JSON.stringify(labels));

            console.log(`Track: ${track}, Base: ${base}, Head: ${head}`);

      # --- Dispatch runner ---
      - name: Dispatch runner
        if: steps.shadow_guard.outputs.blocked != 'true' && steps.killswitch.outputs.disabled != 'true'
        uses: actions/github-script@v7
        env:
          ISSUE_TITLE: ${{ steps.context.outputs.title }}
          ISSUE_TRACK: ${{ steps.context.outputs.track }}
          ISSUE_BASE: ${{ steps.context.outputs.base }}
          ISSUE_HEAD: ${{ steps.context.outputs.head }}
        with:
          github-token: ${{ secrets.WORKFLOW_PAT }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'autopilot-runner.yml',
              ref: process.env.ISSUE_BASE,
              inputs: {
                issue_number: String(process.env.ISSUE_NUMBER),
                issue_title: (process.env.ISSUE_TITLE || '').slice(0, 200),
                track: process.env.ISSUE_TRACK,
                base: process.env.ISSUE_BASE,
                head: process.env.ISSUE_HEAD,
              },
            });

      # --- Update labels ---
      - name: Set STATUS label
        if: steps.shadow_guard.outputs.blocked != 'true' && steps.killswitch.outputs.disabled != 'true'
        uses: actions/github-script@v7
        env:
          LABELS_JSON: ${{ steps.context.outputs.labels }}
        with:
          script: |
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const labels = JSON.parse(process.env.LABELS_JSON || '[]');
            const statusLabels = labels.filter(l => l.startsWith('STATUS:'));
            for (const label of statusLabels) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  name: label,
                });
              } catch {}
            }
            const currentInProgressLabels = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: issueNumber,
            });
            if (!currentInProgressLabels.data.some(l => l.name === 'STATUS: In Progress')) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issueNumber,
                labels: ['STATUS: In Progress'],
              });
            }

      # --- Post progress comment ---
      - name: Post progress comment
        if: steps.shadow_guard.outputs.blocked != 'true' && steps.killswitch.outputs.disabled != 'true'
        uses: actions/github-script@v7
        env:
          ISSUE_TRACK: ${{ steps.context.outputs.track }}
          ISSUE_BASE: ${{ steps.context.outputs.base }}
          ISSUE_HEAD: ${{ steps.context.outputs.head }}
        with:
          script: |
            const marker = '<!-- AUTOPILOT_V2 -->';
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const track = process.env.ISSUE_TRACK;
            const base = process.env.ISSUE_BASE;
            const head = process.env.ISSUE_HEAD;

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 50,
            });

            const existing = comments.data.find(c => c.body.includes(marker));

            const body = [
              marker,
              '### Autopilot — Processing',
              '',
              `| Field | Value |`,
              `|-------|-------|`,
              `| Track | \`${track}\` |`,
              `| Base | \`${base}\` |`,
              `| Head | \`${head}\` |`,
              `| Run | [Workflow](${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) |`,
              '',
              'The autopilot runner has been dispatched.',
            ].join('\n');

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body,
              });
            }
